# E2E full-tier gate (issue #80).
#
# The tiered browser e2e net (issue #75, tests/e2e-browser.test.js)
# deliberately PASSES in DEGRADED mode when a headless build does not expose
# the MV3 service worker as a CDP target: that is the right call for a PR
# gate (no environment flakes, no vacuous pass), but it has a long-tail
# consequence — the behavioral net (storage round-trip, redirect log entry,
# disabled -> no redirect) then only runs on whatever Chrome it last ran
# full on, and CI history showed no way to tell which tier a given run
# actually achieved.
#
# This job inverts the tolerance. It runs the same net on a
# real-browser-capable runner (macos-latest ships a full Chrome, unlike the
# ubuntu-latest image whose headless Chrome has been running the net
# DEGRADED) and REQUIRES the full tier:
#
#   - the e2e run records its achieved tier in e2e-tier.json
#     (full | degraded | skipped);
#   - this job fails unless that file says full.
#
# If the behavioral net is stale/broken, or the environment can no longer
# exercise it, this run fails loudly — instead of every PR silently
# degrading forever. Manual runs (workflow_dispatch) let you demand a hard
# tier on demand, e.g. after a Chrome upgrade lands on the runners.
#
# Browser substrate (issue #106)
#   This job no longer runs against the runner image's floating Chrome.
#   The 2026-10-11 scheduled run hit Chrome 152 on macos-latest, which
#   stopped listing the unpacked MV3 service worker in /json/list as an
#   attachable CDP target, and the gate went `degraded` on its first fire.
#   Instead it downloads a pinned Chrome-for-Testing build —
#   151.0.7922.138, the last stable before the 152 behavior change — and
#   runs the net against it, so a future image-Chrome bump can never
#   silently move the behavioral net off a verified substrate again. The
#   pin itself is guarded by tests/e2e-full-tier-chrome-pin.test.js: a
#   revert to the image's Chrome (or a silent version drift) fails the unit
#   suite on the very push that made the change, not eight days later when
#   the weekly run exposes it.
#
# Triggers
#   `push: [main]` (issue #108) verifies EVERY commit that lands on main
#   with the full real-browser net — the detection window used to be up to
#   7 days (the weekly fire only). It became safe to wire once the full
#   tier was reachable on main: #110 fixed the root cause (the manifest
#   declared the MV2 `background.scripts` key on an MV3 extension, so no
#   service worker was ever registered — the 2026-10-13 "unreachable on any
#   Chrome" ground truth was a symptom of that bug, not a runner
#   limitation), and the verifying run 38684580864 on main recorded
#   e2e-tier=full on the pinned CFT 151.0.7922.138. The Chrome ≥152
#   service-worker regression remains documented on #106 — the pin is
#   load-bearing against it, which is why the gate keeps running the pinned
#   CFT build rather than the runner's floating Chrome.
#
#   The weekly `schedule` (Sunday 06:00 UTC) stays as the backstop that
#   arms the #83 freshness tripwire (#88: only `event: schedule` runs
#   arm/clear it), and `workflow_dispatch` is the on-demand diagnostic
#   lever.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, Sunday 06:00 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

jobs:
  e2e-full-tier:
    name: E2E (require FULL tier)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the runner's Chrome-for-Testing architecture
        id: arch
        run: |
          case "$(uname -m)" in
            arm64)  echo "plat=mac-arm64" >> "$GITHUB_OUTPUT" ;;
            x86_64) echo "plat=mac-x64" >> "$GITHUB_OUTPUT" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
      # #106: pinned Chrome-for-Testing substrate (see header). The CFT
      # release zips have a fixed layout: a top-level "chrome-<plat>" dir
      # containing "Google Chrome for Testing.app". The key is scoped by
      # version + platform, so bumping the pin changes the key and the
      # ~190MB download runs exactly once per new pin.
      - name: Cache pinned Chrome-for-Testing (#106)
        id: cft-cache
        uses: actions/cache@v4
        with:
          path: chrome-for-testing-cft
          key: cft-151.0.7922.138-${{ steps.arch.outputs.plat }}
      - name: Download pinned Chrome-for-Testing (#106)
        if: steps.cft-cache.outputs.cache-hit != 'true'
        env:
          CFT_PLAT: ${{ steps.arch.outputs.plat }}
        run: |
          set -euo pipefail
          version=151.0.7922.138
          mkdir -p chrome-for-testing-cft
          curl -fsSL -o "/tmp/cft-${CFT_PLAT}.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${version}/${CFT_PLAT}/chrome-${CFT_PLAT}.zip"
          unzip -q "/tmp/cft-${CFT_PLAT}.zip" -d chrome-for-testing-cft
          rm -f "/tmp/cft-${CFT_PLAT}.zip"
          # Fail closed if the release layout ever changes.
          test -x "chrome-for-testing-cft/chrome-${CFT_PLAT}/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
      - name: Run browser e2e (CDP, no npm deps)
        env:
          QHYOP_E2E_BROWSER: "1"
          # #106: the pinned Chrome-for-Testing binary, NOT the image's
          # floating Chrome (which reached 152 and stopped surfacing the
          # MV3 SW in /json/list). The download step above verified the
          # binary exists (and is executable) before this step runs.
          CHROME_BIN: "chrome-for-testing-cft/chrome-${{ steps.arch.outputs.plat }}/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
        run: node --test tests/e2e-browser.test.js
      - name: Require the full tier (#80)
        # PR runs stay tolerant by design; this scheduled run must not.
        # Anything short of a full behavioral pass is a regression signal.
        run: |
          set -euo pipefail
          test -f e2e-tier.json || { echo "FAIL: e2e-tier.json missing — the e2e run did not complete"; exit 1; }
          node -e "
            const t = JSON.parse(require('fs').readFileSync('e2e-tier.json', 'utf8'));
            if (t.tier !== 'full') {
              console.error('FAIL: e2e tier is ' + t.tier + ' (required: full) — ' + (t.detail || ''));
              process.exit(1);
            }
            console.log('OK: full behavioral net passed (' + (t.browser || 'unknown browser') + ')');
          "
