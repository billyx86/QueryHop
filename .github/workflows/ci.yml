name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check extension and host-app JavaScript
        # Issue #59: the file list was hand-maintained and missed the three
        # bg* modules split out of background.js (#51) — a parse-level
        # breakage in a module no test imports would have slipped through
        # this job's declared coverage. Derive the list instead: every
        # tracked .js next to manifest.json ships in the appex and is a
        # hard dependency of the service worker, so it must parse. All
        # extension modules are ES modules (the nearest package.json
        # declares "type": "module"), which is why plain `node --check`
        # already accepted the import/export statements.
        run: |
          for f in "QueryHop Extension/Resources/"*.js QueryHop/Resources/Script.js; do
            node --check "$f"
          done
      - name: Lint all JavaScript (ESLint flat config, zero deps)
        # Issue #79: node --check above is a syntax floor — it sees parse
        # errors only. It cannot see undeclared names, dead bindings,
        # sloppy equality, unawaited async, or duplicate keys; that is the
        # drift this gate exists for. ESLint 9 runs against the repo's
        # self-contained flat config (eslint.config.js imports no npm
        # packages, so the zero-npm-deps policy holds: npx fetches eslint
        # itself but nothing lands in package.json or a lockfile). The
        # ruleset is a drift floor, not a style police — only the
        # correctness classes guards exist to catch, so it cannot demand a
        # repo-wide reformat of the text-parsed drift-guard files.
        # Issue #84: the version is pinned EXACTLY (eslint@9.39.5, matching
        # the vitest 3.2.7 pinning convention in the sibling repos) so an
        # upstream eslint release can never change the gate's behaviour or
        # findings under a PR — `eslint@9` floating to a new minor would do
        # exactly that, silently. Bumping the pin is an intentional,
        # reviewed change.
        run: npx -y -p eslint@9.39.5 eslint .
      - name: Validate JSON resources
        run: |
          node -e "
            const fs = require('fs');
            for (const p of [
              'QueryHop Extension/Resources/manifest.json',
              'QueryHop Extension/Resources/_locales/en/messages.json',
              'QueryHop Extension/Resources/_locales/de/messages.json',
            ]) {
              JSON.parse(fs.readFileSync(p, 'utf8'));
              console.log('OK', p);
            }
          "
      - name: Guard against spaced filenames and "Copy N" duplicates
        # Issue #40: Xcode's "Copy 1" duplicates ("Icon-256 1.png" and friends)
        # bloated the appiconset. Directories like "QueryHop Extension/" are
        # legitimate, so check file BASENAMES, not full paths.
        run: |
          set -euo pipefail
          spaced=$(git ls-files | awk -F/ '{print $NF}' | grep -E ' ' || true)
          if [ -n "$spaced" ]; then
            echo "FAIL: tracked filenames must not contain a space:"
            echo "$spaced"
            exit 1
          fi
          dupes=$(git ls-files | awk -F/ '{print $NF}' | grep -E ' [0-9]+\.[A-Za-z0-9]+$' || true)
          if [ -n "$dupes" ]; then
            echo "FAIL: \" N.ext\"-style duplicate filenames detected:"
            echo "$dupes"
            exit 1
          fi
          echo "OK: no spaced or \"Copy N\" duplicate filenames"
      - name: Sanity-check manifest engine/host permission sync
        # The expected engine hosts are DERIVED from searchEngines in
        # background.js — no hand-maintained engine list here (the old
        # six-domain list missed Yandex, issue #27). The single
        # implementation lives in tests/engine-permissions-sync.test.js;
        # running just that file keeps this guard working even if the full
        # suite is reorganized.
        run: node --test tests/engine-permissions-sync.test.js
      - name: Sanity-check Safari Info.plist allowed-domain sync
        # Issue #76: the Safari Web-Extension bundle manifest (Info.plist)
        # declares a second, previously unguarded copy of the engine host
        # list. Its "Allowed Domains" must cover every canonical engine host
        # derived from searchEngines — the old 7-domain list missed 11 Google
        # and 4 Yandex TLDs, so those never redirected on Safari. The guard
        # imports the real searchEngines and re-derives the hosts (no
        # hard-coded list), mirroring the Chrome host_permissions check above.
        run: node --test tests/safari-allowed-domains.test.js
      - name: Guard against release/manifest version drift (#54)
        # main must carry a matching GitHub release (tag b<version>): the
        # 1.0.2 manifest sat for 18 months with no release (b1.0-2 was the
        # newest). This fails the build until a release exists for the
        # current manifest version, so the drift can't accumulate silently
        # again. The gh CLI needs GH_TOKEN set (the runner's default
        # GITHUB_TOKEN is not picked up automatically); read access to
        # releases is sufficient.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-drift.mjs
      - name: Guard against orphaned/stale release tags (#67)
        # Every b* tag must point at a commit reachable from origin/main —
        # an orphaned tag (never merged, or re-pointed backwards) is
        # fatal, because a mirror/fork re-push would run workflow code
        # from a branch that never landed. The CURRENT version's tag
        # (b<manifest version>) is also checked against the latest
        # release-macos.yml: GitHub Actions checks out the workflow FROM
        # the ref being run, so a stale tag re-push executes the old
        # pipeline — the exact hazard b1.0.2 sat in for weeks. Staleness
        # is a WARN here, not a failure: every PR that touches the
        # release workflow makes the tag stale until it is re-pointed
        # after merge, so hard-failing would deadlock those PRs.
        run: node scripts/check-release-tag-hygiene.mjs
      - name: Full-tier e2e gate freshness (#83)
        # Tripwire for the weekly e2e-full-tier.yml gate (issue #80): it is
        # the only surface where the behavioral browser net runs FULL, and it
        # previously had no health check — a dead schedule or a silently
        # failing runner image went unnoticed. This fails the CURRENT push if
        # the workflow file is missing or de-scheduled, if it has never fired
        # past its grace window, if its last successful run is older than 8
        # days, or if its latest completed run is not a success. The human-
        # readable evidence line is surfaced by the e2e-browser job, next to
        # the per-PR tier.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-e2e-full-tier-freshness.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests (node --test)
        run: npm test
  # Browser end-to-end smoke net (issue #75). The `test` job above runs the
  # full `node --test` suite, but tests/e2e-browser.test.js only launches a
  # real headless browser when QHYOP_E2E_BROWSER=1, so this dedicated job opts
  # in. It runs on ubuntu-latest, which ships Chrome, and drives the unpacked
  # MV3 extension for real: save a custom search URL through the popup, then
  # navigate to a Google search URL and assert the background redirects the
  # tab (and records a debug-log entry), plus the negative case (disabled ->
  # no redirect). The test is dependency-free (Node's built-in WebSocket + the
  # CDP HTTP endpoints) to match the repo's zero-npm-deps philosophy, and it
  # self-skips to a pass if a working headless browser can't launch, so it can
  # never flake the PR on a missing/crashing browser.
  e2e-browser:
    name: E2E (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run browser e2e (CDP, no npm deps)
        env:
          QHYOP_E2E_BROWSER: "1"
          # Point the harness at the CI image's Chrome.
          CHROME_BIN: /usr/bin/google-chrome
        run: node --test tests/e2e-browser.test.js
      - name: Record e2e tier in step summary (#80)
        # The tiered net passes in DEGRADED mode by design (environmental,
        # not a regression) — but a PR gate that can degrade forever is a
        # stale-behavioral-net risk. The run records which tier it achieved
        # in e2e-tier.json; surfacing it in the step summary makes CI history
        # auditable, and the weekly e2e-full-tier workflow hard-fails on
        # anything short of full. A missing file (e2e never ran) is not a
        # failure here — the PR job stays tolerant; the weekly job does not.
        run: |
          if [ -f e2e-tier.json ]; then
            echo '### e2e tier outcome' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat e2e-tier.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### e2e tier outcome' >> "$GITHUB_STEP_SUMMARY"
            echo '_e2e-tier.json not written (browser phase did not run)_' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Full-tier gate health in step summary (#83)
        # The per-PR tier above degrades by design, so a diff against the
        # WEEKLY full-tier gate is only visible if the gate's own state is
        # surfaced on every push. This appends the gate health line (fresh /
        # in-progress / grace / failing / stale + the last successful run id
        # and timestamp) next to the per-PR tier. Evidence only — the hard
        # tripwire that fails the PR lives in the validate job. The script is
        # tolerant here (|| true) so a gate regression is reported in the
        # summary, not hidden behind a failed step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### full-tier gate health (weekly, #83)'
            node scripts/check-e2e-full-tier-freshness.mjs \
              || echo '_the gate is UNHEALTHY — see the validate job for the failing tripwire_'
          } >> "$GITHUB_STEP_SUMMARY"
  # Release gate for the Swift host app + Safari extension (issue #7): the
  # Swift sources are only syntax-reviewed on Linux, so they must actually be
  # compiled with Xcode on every PR before they can be merged.
  #
  # Signing: CODE_SIGNING_ALLOWED=NO so the job works on GitHub-hosted
  # runners without the owner's development team. To upgrade this to real
  # code-sign verification, add the CI user to the DEVELOPMENT_TEAM in
  # project.pbxproj and drop the override — the structural bundle check
  # below then additionally proves the extension is signed and embedded.
  build-macos:
    name: Build (macOS, Xcode)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -n1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Issue #45: persist DerivedData between runs. The key hashes every
      # build input (project file, all targets, this workflow) together with
      # the runner's Xcode version, so a change rebuilds only what it
      # touched instead of the whole project from scratch. restore-keys
      # warms the build from the newest same-Xcode entry when the exact key
      # is unseen; Xcode's own build system stays authoritative about what
      # actually needs recompiling.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-deriveddata-${{ hashFiles('QueryHop.xcodeproj/**', 'QueryHop/**', 'QueryHop Extension/**', 'QueryHopTests/**', 'Shared/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-deriveddata-
      - name: Build host app + embedded extension (Debug)
        run: |
          xcodebuild build \
            -project QueryHop.xcodeproj \
            -scheme QueryHop \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Locate built products
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name 'QueryHop.app' -print -quit)
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Verify extension bundle is embedded and intact
        run: |
          set -euo pipefail
          # Modern Xcode (15+) embeds app extensions under Contents/PlugIns/;
          # older Xcode used Contents/Extensions/. Discover whichever exists
          # instead of hard-coding a single layout.
          APPEX=""
          for cand in \
            "$APP/Contents/PlugIns/QueryHop Extension.appex" \
            "$APP/Contents/Extensions/QueryHop Extension.appex"; do
            if [ -d "$cand" ]; then APPEX="$cand"; break; fi
          done
          if [ -z "$APPEX" ]; then
            APPEX=$(find "$APP/Contents" -maxdepth 3 -name 'QueryHop Extension.appex' -print -quit)
          fi
          test -n "$APPEX" && [ -d "$APPEX" ] || { echo "FAIL: extension appex not embedded in $APP (searched PlugIns/ + Extensions/)"; exit 1; }
          echo "APPEX=$APPEX"
          # Info.plist must be well-formed and declare the Safari web-extension point.
          plutil -lint "$APPEX/Contents/Info.plist"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APPEX/Contents/Info.plist" | grep -qx 'com.apple.Safari.web-extension' || { echo "FAIL: wrong NSExtensionPointIdentifier"; exit 1; }
          # Locate the web extension payload inside the appex (resource layout
          # can vary between Xcode versions — resolve relative to manifest.json).
          MANIFEST=$(find "$APPEX/Contents" -name manifest.json -print -quit)
          test -n "$MANIFEST" || { echo "FAIL: manifest.json not found inside appex"; exit 1; }
          RESDIR=$(dirname "$MANIFEST")
          # Derive the required-file list from the source tree instead of
          # hand-maintaining it (#59): every .js next to manifest.json is
          # shipped in the appex, and the bg* modules (#51) are hard imports
          # of background.js — a missing one breaks the service worker at
          # startup even though background.js itself is present.
          SRCRES="QueryHop Extension/Resources"
          REQUIRED=""
          for f in "$SRCRES"/*.js; do REQUIRED="$REQUIRED $(basename "$f")"; done
          for f in popup.html popup.css; do REQUIRED="$REQUIRED $f"; done
          for f in $REQUIRED; do
            test -f "$RESDIR/$f" || { echo "FAIL: missing $f next to manifest.json in appex"; exit 1; }
          done
          # i18n: the default locale must ship inside the appex (chrome.i18n
          # resolves __MSG_* and getMessage against it); the German locale is
          # checked as well once a second language is bundled (#21).
          test -f "$RESDIR/_locales/en/messages.json" || { echo "FAIL: missing _locales/en/messages.json in appex"; exit 1; }
          if [ -d "$RESDIR/_locales/de" ]; then
            test -f "$RESDIR/_locales/de/messages.json" || { echo "FAIL: incomplete _locales/de in appex"; exit 1; }
          fi
          node -e "const m = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); if (m.manifest_version !== 3) { console.error('FAIL: manifest_version != 3'); process.exit(1); } console.log('OK: appex manifest.json is valid MV3')" "$MANIFEST"
          echo "OK: extension bundle embedded and intact ($MANIFEST)"
      - name: Run Swift unit tests (QueryHopTests)
        # Issue #41: the native Swift side (host-window bridge helpers, the
        # SafariWebExtensionHandler message codec, and the host-window
        # resource contract) is covered by an XCTest target. xcodebuild
        # reuses the DerivedData built above, so this only builds the
        # .xctest bundle and runs it.
        run: |
          xcodebuild test \
            -project QueryHop.xcodeproj \
            -scheme QueryHop \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
