name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check extension and host-app JavaScript
        run: |
          node --check "QueryHop Extension/Resources/background.js"
          node --check "QueryHop Extension/Resources/popup.js"
          node --check "QueryHop Extension/Resources/popupRules.js"
          node --check "QueryHop Extension/Resources/popupState.js"
          node --check "QueryHop Extension/Resources/popupI18n.js"
          node --check "QueryHop/Resources/Script.js"
      - name: Validate JSON resources
        run: |
          node -e "
            const fs = require('fs');
            for (const p of [
              'QueryHop Extension/Resources/manifest.json',
              'QueryHop Extension/Resources/_locales/en/messages.json',
              'QueryHop Extension/Resources/_locales/de/messages.json',
            ]) {
              JSON.parse(fs.readFileSync(p, 'utf8'));
              console.log('OK', p);
            }
          "
      - name: Guard against spaced filenames and "Copy N" duplicates
        # Issue #40: Xcode's "Copy 1" duplicates ("Icon-256 1.png" and friends)
        # bloated the appiconset. Directories like "QueryHop Extension/" are
        # legitimate, so check file BASENAMES, not full paths.
        run: |
          set -euo pipefail
          spaced=$(git ls-files | awk -F/ '{print $NF}' | grep -E ' ' || true)
          if [ -n "$spaced" ]; then
            echo "FAIL: tracked filenames must not contain a space:"
            echo "$spaced"
            exit 1
          fi
          dupes=$(git ls-files | awk -F/ '{print $NF}' | grep -E ' [0-9]+\.[A-Za-z0-9]+$' || true)
          if [ -n "$dupes" ]; then
            echo "FAIL: \" N.ext\"-style duplicate filenames detected:"
            echo "$dupes"
            exit 1
          fi
          echo "OK: no spaced or \"Copy N\" duplicate filenames"
      - name: Sanity-check manifest engine/host permission sync
        # The expected engine hosts are DERIVED from searchEngines in
        # background.js — no hand-maintained engine list here (the old
        # six-domain list missed Yandex, issue #27). The single
        # implementation lives in tests/engine-permissions-sync.test.js;
        # running just that file keeps this guard working even if the full
        # suite is reorganized.
        run: node --test tests/engine-permissions-sync.test.js
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests (node --test)
        run: npm test
  # Release gate for the Swift host app + Safari extension (issue #7): the
  # Swift sources are only syntax-reviewed on Linux, so they must actually be
  # compiled with Xcode on every PR before they can be merged.
  #
  # Signing: CODE_SIGNING_ALLOWED=NO so the job works on GitHub-hosted
  # runners without the owner's development team. To upgrade this to real
  # code-sign verification, add the CI user to the DEVELOPMENT_TEAM in
  # project.pbxproj and drop the override — the structural bundle check
  # below then additionally proves the extension is signed and embedded.
  build-macos:
    name: Build (macOS, Xcode)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build host app + embedded extension (Debug)
        run: |
          xcodebuild build \
            -project QueryHop.xcodeproj \
            -scheme QueryHop \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Locate built products
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name 'QueryHop.app' -print -quit)
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Verify extension bundle is embedded and intact
        run: |
          set -euo pipefail
          # Modern Xcode (15+) embeds app extensions under Contents/PlugIns/;
          # older Xcode used Contents/Extensions/. Discover whichever exists
          # instead of hard-coding a single layout.
          APPEX=""
          for cand in \
            "$APP/Contents/PlugIns/QueryHop Extension.appex" \
            "$APP/Contents/Extensions/QueryHop Extension.appex"; do
            if [ -d "$cand" ]; then APPEX="$cand"; break; fi
          done
          if [ -z "$APPEX" ]; then
            APPEX=$(find "$APP/Contents" -maxdepth 3 -name 'QueryHop Extension.appex' -print -quit)
          fi
          test -n "$APPEX" && [ -d "$APPEX" ] || { echo "FAIL: extension appex not embedded in $APP (searched PlugIns/ + Extensions/)"; exit 1; }
          echo "APPEX=$APPEX"
          # Info.plist must be well-formed and declare the Safari web-extension point.
          plutil -lint "$APPEX/Contents/Info.plist"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APPEX/Contents/Info.plist" | grep -qx 'com.apple.Safari.web-extension' || { echo "FAIL: wrong NSExtensionPointIdentifier"; exit 1; }
          # Locate the web extension payload inside the appex (resource layout
          # can vary between Xcode versions — resolve relative to manifest.json).
          MANIFEST=$(find "$APPEX/Contents" -name manifest.json -print -quit)
          test -n "$MANIFEST" || { echo "FAIL: manifest.json not found inside appex"; exit 1; }
          RESDIR=$(dirname "$MANIFEST")
          for f in background.js popup.html popup.js popupRules.js popupState.js popupI18n.js popup.css; do
            test -f "$RESDIR/$f" || { echo "FAIL: missing $f next to manifest.json in appex"; exit 1; }
          done
          # i18n: the default locale must ship inside the appex (chrome.i18n
          # resolves __MSG_* and getMessage against it); the German locale is
          # checked as well once a second language is bundled (#21).
          test -f "$RESDIR/_locales/en/messages.json" || { echo "FAIL: missing _locales/en/messages.json in appex"; exit 1; }
          if [ -d "$RESDIR/_locales/de" ]; then
            test -f "$RESDIR/_locales/de/messages.json" || { echo "FAIL: incomplete _locales/de in appex"; exit 1; }
          fi
          node -e "const m = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); if (m.manifest_version !== 3) { console.error('FAIL: manifest_version != 3'); process.exit(1); } console.log('OK: appex manifest.json is valid MV3')" "$MANIFEST"
          echo "OK: extension bundle embedded and intact ($MANIFEST)"
      - name: Run Swift unit tests (QueryHopTests)
        # Issue #41: the native Swift side (host-window bridge helpers, the
        # SafariWebExtensionHandler message codec, and the host-window
        # resource contract) is covered by an XCTest target. xcodebuild
        # reuses the DerivedData built above, so this only builds the
        # .xctest bundle and runs it.
        run: |
          xcodebuild test \
            -project QueryHop.xcodeproj \
            -scheme QueryHop \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
